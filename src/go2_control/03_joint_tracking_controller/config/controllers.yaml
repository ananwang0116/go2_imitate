controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    go2_balance_effort_controller:
      type: go2_control/BalanceEffortController
    go2_joint_tracking_controller:
      type: joint_trajectory_controller/JointTrajectoryController
go2_joint_tracking_controller:
  ros__parameters:
    joints:
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    gains:
      FL_hip_joint:
        p: 80.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      FL_thigh_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      FL_calf_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      FR_hip_joint:
        p: 80.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      FR_thigh_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      FR_calf_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RL_hip_joint:
        p: 80.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RL_thigh_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RL_calf_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RR_hip_joint:
        p: 80.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RR_thigh_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0
      RR_calf_joint:
        p: 200.0
        i: 0.0
        d: 0.8
        i_clamp: 0.0
        ff_velocity_scale: 0.0

go2_balance_effort_controller:
  ros__parameters:
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint, FR_hip_joint, FR_thigh_joint, FR_calf_joint, RL_hip_joint, RL_thigh_joint, RL_calf_joint, RR_hip_joint, RR_thigh_joint, RR_calf_joint]
    kp_hip: 50.0
    kp_leg: 100.0
    kd: 2.0
    command_timeout: 0.1
